<!DOCTYPE html>
<html>
<head>

    <title>Add Game</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>Add New Retro Game</h1>

<form id="gameForm">

    <input
            id="title"
            placeholder="Title">

    <br><br>

    <input
            id="platform"
            placeholder="Platform">

    <br><br>

    <input
            id="releaseDate"
            placeholder="YYYY-MM-DD">

    <br><br>

    <textarea
            id="description"
            placeholder="Description"></textarea>

    <br><br>

    <button type="submit">

        Save

    </button>

</form>

<script src="app.js"></script>

</body>
</html>
